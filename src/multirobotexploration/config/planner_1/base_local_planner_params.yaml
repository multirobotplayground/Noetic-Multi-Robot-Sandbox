TebLocalPlannerROS:

 odom_topic: /robot_1/odom
 map_frame: robot_1/map

 # Trajectory - Optimized for smoother turns
  
 teb_autosize: True
 dt_ref: 0.3
 dt_hysteresis: 0.1
 max_samples: 500
 global_plan_overwrite_orientation: True
 allow_init_with_backwards_motion: False
 max_global_plan_lookahead_dist: 3.0
 global_plan_viapoint_sep: -1
 global_plan_prune_distance: 1
 exact_arc_length: False
 feasibility_check_no_poses: 2
 publish_feedback: False
    
 # Robot - Pioneer 3AT specifications
         
 max_vel_x: 1.0                       # Reduced from 1.2 for better control
 max_vel_x_backwards: 0.5             # Conservative reverse speed
 max_vel_theta: 1.5                   # Reduced from 1.5 for smoother turns
 acc_lim_x: 0.2                       # Reduced from 0.25 for smoother acceleration
 acc_lim_theta: 0.4                   # Reduced from 1.0 for smoother turning
 min_turning_radius: 0.0              # Skid-steer can turn in place
 wheelbase: 0.0
 footprint_model: # Pioneer 3AT dimensions
   type: "circular"
   radius: 0.35 # Pioneer 3AT approximate radius (0.7m length)
   line_start: [-0.3, 0.0] # for type "line"
   line_end: [0.3, 0.0] # for type "line"
   front_offset: 0.2 # for type "two_circles"
   front_radius: 0.2 # for type "two_circles"
   rear_offset: 0.2 # for type "two_circles"
   rear_radius: 0.2 # for type "two_circles"
   vertices: [ [0.25, -0.05], [0.18, -0.05], [0.18, -0.18], [-0.19, -0.18], [-0.25, 0], [-0.19, 0.18], [0.18, 0.18], [0.18, 0.05], [0.25, 0.05] ] # for type "polygon"

 # GoalTolerance - Optimized for exploration
    
 xy_goal_tolerance: 3.0               # Reasonable tolerance to prevent overshooting
 yaw_goal_tolerance: 3.2              # Tighter yaw control to prevent overshooting
 free_goal_vel: False              
    
 # Obstacles - Optimized for Pioneer 3AT
    
 min_obstacle_dist: 0.3              # Closer approach for tighter spaces
 include_costmap_obstacles: True
 costmap_obstacles_behind_robot_dist: 1.5
 obstacle_poses_affected: 25          # Reduced for performance
 costmap_converter_plugin: "costmap_converter::CostmapToPolygonsDBSMCCH"  # Better for navigation
 costmap_converter_spin_thread: True
 costmap_converter_rate: 8            # Higher rate for responsive obstacle detection

 # Optimization - Tuned for smoother turning
    
 no_inner_iterations: 5               # Reduced from 10 for faster, less aggressive optimization
 no_outer_iterations: 3               # Reduced from 15 for less aggressive optimization
 optimization_activate: True
 optimization_verbose: False
 penalty_epsilon: 0.1                 # Increased from 0.05 for softer optimization
 weight_max_vel_x: 1                  # Reduced from 2 to discourage aggressive speed
 weight_max_vel_theta: 1              # Reduced from 5 for smoother turning
 weight_acc_lim_x: 10                  # Increased from 1 to enforce acceleration limits
 weight_acc_lim_theta: 2              # Reduced from 100 for balanced angular control
 weight_kinematics_nh: 1000000           # Keep non-holonomic constraints
 weight_kinematics_forward_drive: 10000   # Reduced from 10 for balanced motion
 weight_kinematics_turning_radius: 0
 weight_shortest_path: 20
 weight_optimaltime: 10                # Reduced from 2 to prioritize smoothness over speed
 weight_obstacle: 1000                 # Higher obstacle avoidance weight
 weight_dynamic_obstacle: 0.1          # Higher dynamic obstacle weight
 alternative_time_cost: False

 # Homotopy Class Planner - Optimized for exploration

 enable_homotopy_class_planning: True
 enable_multithreading: True
 simple_exploration: False
 max_number_classes: 3                # Reduced for performance
 roadmap_graph_no_samples: 12         # Reduced for faster computation
 roadmap_graph_area_width: 4          # Smaller search area
 h_signature_prescaler: 0.6           # Adjusted for better path distinction
 h_signature_threshold: 0.15          # Slightly higher threshold
 obstacle_keypoint_offset: 0.1
 obstacle_heading_threshold: 0.45
 visualize_hc_graph: False